<!doctype html>
<html lang="es" data-expected-role="medico">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hospital de Ubaté - Panel Médico</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header class="topbar">
        <a href="index.html" class="drawer-toggle" aria-label="Volver al inicio" style="text-decoration:none;">
            &#8592;
        </a>
        <h1 class="hospital-name">HOSPITAL DE UBATÉ</h1>
    </header>

    <main class="container">
        <section class="panel" id="panel-staff">
            <header class="panel-header">
                <h3 id="panel-title">Panel Médico</h3>
                <div class="panel-actions">
                    <button class="btn green" id="btn-view-active">Activos</button>
                    <button class="btn red" id="btn-view-egresados">Egresados</button>
                    <button class="btn ghost" id="btn-logout">Cerrar sesión</button>
                </div>
            </header>

            <div class="panel-body">
                <aside class="left">
                    <div class="search">
                        <input id="search-patient" placeholder="Buscar por nombre / internalId / publicCode" />
                        <button class="btn" id="btn-search">Buscar</button>
                    </div>
                    <div class="list" id="patient-list"></div>
                </aside>

                <section class="right" id="patient-detail">
                    <div class="muted">Selecciona un paciente para ver detalles</div>
                </section>
            </div>
        </section>
    </main>

    <div class="overlay hidden" id="modal-view">
        <div class="ig-modal-large" role="dialog" aria-modal="true">
            <button class="ig-close" id="btn-close-view" aria-label="Cerrar">&times;</button>
            <div class="ig-content-large" id="modal-view-content"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
        import { firebaseConfig } from "./js/firebase-config.js";

        const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.eseb = window.eseb || {};
        window.eseb.auth = {
            currentSession() {
                const raw = sessionStorage.getItem("eseb_staff_session");
                if (!raw) return null;
                try {
                    const s = JSON.parse(raw);
                    if (s && !s.username) s.username = s.displayName || s.email || "staff";
                    return s;
                } catch (e) { return null; }
            },
            async logout() {
                sessionStorage.removeItem("eseb_staff_session");
                try { await signOut(auth); } catch (e) { console.warn("Error cerrando Firebase Auth:", e); }
                window.location.href = "login.html";
            }
        };
    </script>
    <script src="js/api.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/storage.js" defer></script>
    <script src="js/validators.js" defer></script>
    <script src="js/audit.js" defer></script>
    <script src="js/patients.js" defer></script>
    <script src="js/rooms.js" defer></script>
    <script src="js/doctors.js" defer></script>
    <script src="js/procedures.js" defer></script>
    <script src="js/modals.js" defer></script>
    <script src="js/staff-panel.js" defer></script>
</body>
</html>
